<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OLX Prototype</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="prototype.css">
</head>
<body>
  <div class="pt">
    <header class="pt-bar">
      <button class="pt-iconbtn" id="pt-menu" type="button" aria-expanded="false" aria-controls="pt-side" title="Screens and flows">☰<span class="pt-vh">Screens and flows</span></button>
      <a class="pt-brand" href="#home~desktop"><span class="pt-brand__mark" aria-hidden="true">OLX</span><span>Prototype</span></a>
      <button class="pt-btn" id="pt-back" type="button" disabled>← Back</button>
      <h1 class="pt-screen" id="pt-screen">Loading…</h1>
      <div class="pt-seg" role="group" aria-label="Device">
        <button type="button" data-vp="desktop" aria-pressed="true">Desktop</button>
        <button type="button" data-vp="mobile" aria-pressed="false">Mobile</button>
      </div>
      <label class="pt-switch"><input type="checkbox" id="pt-hotspots"> Show hotspots</label>
      <button class="pt-btn" id="pt-sections-toggle" type="button" aria-expanded="false" aria-controls="pt-sections">Sections</button>
    </header>
    <aside class="pt-side" id="pt-side" aria-label="Screens and flows"></aside>
    <main class="pt-main">
      <div class="pt-flow" id="pt-flow" hidden></div>
      <div class="pt-stage" id="pt-stage"></div>
    </main>
    <aside class="pt-sections" id="pt-sections" aria-label="Sections" hidden></aside>
  </div>
  <script src="prototype.js"></script>
</body>
</html>
