name: Deploy book and Storybook to GitHub Pages

# Publishes the design system book at the site root, the clickable prototype in
# proto/, the Storybook in storybook/ and the component showcase in showcase/.
# The build is offline: it only reads what is committed (site/, components/,
# templates/, assets/, storybook/design-kit/). Licensed fonts are not in git, so
# the published copy renders with fallback fonts.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storybook/package-lock.json
      - name: Build book and prototype
        run: |
          node scripts/build-prototype.mjs
          node scripts/build-publish.mjs
        env:
          BOOK_STORYBOOK_URL: storybook/
      - name: Build Storybook
        working-directory: storybook
        run: |
          npm ci
          npx storybook build --quiet -o ../dist/book/storybook
      - name: Add component showcase
        run: |
          mkdir -p dist/book/showcase
          cp index.html dist/book/showcase/index.html
          cp -r css dist/book/showcase/css
          mkdir -p dist/book/showcase/dist
          cp dist/tokens.js dist/book/showcase/dist/tokens.js
          touch dist/book/.nojekyll
      - name: Redirect the local paths (/book/, /prototype/) to their published homes
        run: |
          redirect() { # $1 = directory to create, $2 = target relative to it
            mkdir -p "dist/book/$1"
            printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Redirecting…</title>' \
              "<meta http-equiv=\"refresh\" content=\"0; url=$2\"><link rel=\"canonical\" href=\"$2\">" \
              "<script>location.replace('$2' + location.search + location.hash)</script>" \
              "<a href=\"$2\">Continue</a>" > "dist/book/$1/index.html"
          }
          redirect book ../
          redirect prototype ../proto/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
